<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column built for a thumb. Sticky search on top, letter strip under it, results grouped A to Z. */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --fg: #14181F;
  --muted: #5B6573;
  --line: #DCE1E7;
  --accent: #D9480F;
  --accent-soft: #FFE3D0;
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #171B22; --fg: #ECEFF3; --muted: #98A2B0;
    --line: #262C36; --accent: #FF8A4C; --accent-soft: #55290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #171B22; --fg: #ECEFF3; --muted: #98A2B0;
  --line: #262C36; --accent: #FF8A4C; --accent-soft: #55290F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 48px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 640px; margin-inline: auto; }

.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 14px 10px;
  margin-inline: -16px;
  padding-inline: 16px;
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 0;
  text-wrap: balance;
}
h1 span { color: var(--accent); }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.search { position: relative; }
.search input {
  width: 100%;
  font: inherit;
  font-size: 17px;
  color: var(--fg);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 13px 44px 13px 14px;
  appearance: none;
  -webkit-appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border: 0; background: none; color: var(--muted);
  font-size: 1.3rem; cursor: pointer; border-radius: 8px;
}
.clear:focus-visible { outline: 2px solid var(--accent); }

.letters {
  display: flex; gap: 4px; overflow-x: auto; padding-block: 2px;
  scrollbar-width: none;
}
.letters::-webkit-scrollbar { display: none; }
.letters button {
  flex: 0 0 auto;
  min-width: 34px; height: 34px;
  font: inherit; font-weight: 600; font-size: 0.85rem;
  color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
}
.letters button:focus-visible { outline: 2px solid var(--accent); }
.letters button:active { background: var(--accent-soft); }

main { padding-top: 6px; }
.status { color: var(--muted); font-size: 0.85rem; padding-block: 12px 4px; }

.group-head {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--accent);
  padding-block: 20px 6px;
  scroll-margin-top: calc(var(--top-h, 120px) + 8px);
}
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  min-width: 0;
}
.w {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.m { margin-top: 4px; font-size: 1.02rem; overflow-wrap: anywhere; }
.o { margin-top: 6px; font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding-inline: 1px; }

.empty { padding-block: 28px; color: var(--muted); }
.empty b { color: var(--fg); }
footer { margin-top: 32px; font-size: 0.78rem; color: var(--muted); }
footer a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="top" id="top">
  <div class="top-inner">
    <div class="title-row">
      <h1>Nadsat<span>.</span></h1>
      <div class="count" id="count"></div>
    </div>

      <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="letters" id="letters" aria-label="Jump to letter"></div>
  </div>
</div>

<div class="wrap">
  <main>
    <div class="status" id="status" aria-live="polite"></div>
    <div id="results"></div>

      available under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
    </footer>
  </main>
</div>

<script>
const ENTRIES = [{"w":"all that cow","m":"all that rubbish","o":"possibly influenced by cal, see below"},{"w":"appy-polly-loggies","m":"apologies","o":"Highly exaggerated pronunciation of apologies – Burgess's homage to James Joyce's ALP in Finnegans Wake"},{"w":"auto","m":"car","o":"Short for automobile; mirrors the usage in Russian: see авто (avto). Not exclusively Nadsat."},{"w":"baboochka","m":"old woman","o":"бабушка (babuška, literally “ grandmother ”)"},{"w":"baddiwad","m":"bad","o":"Reduplication of bad Young child talk"},{"w":"banda","m":"band","o":"банда (banda, “ gang ”)"},{"w":"barry place","m":"prison","o":"From bars on windows in prisons."},{"w":"bedways","m":"to bed","o":""},{"w":"bezoomny","m":"mad, crazy","o":"безумный (bezumnyj)"},{"w":"biblio","m":"library","o":"библиотека (biblioteka) from bibliothèque"},{"w":"bitva","m":"battle","o":"битва (bitva)"},{"w":"blub","m":"weep, cry","o":"English slang. Not exclusively Nadsat. From the verb form of the English word blubber, often used in a dismissive or insensitive manner, meaning to sob or weep noisily."},{"w":"Bog","m":"God","o":"бог (bog) (pronounced /box/ (where x sounds like kh) or (in some dialects) /bog/)"},{"w":"bogman","m":"godman","o":"See section G below"},{"w":"boomaboom","m":"thunder","o":"Onomatopoeia. Reduplication of boom"},{"w":"bolnoy","m":"sick","o":"больной (bolʹnoj)"},{"w":"bolshy","m":"big, great","o":"большой (bolʹšoj); больший (bolʹšij, “ larger ”). Cf bolshie"},{"w":"boohoo, boohoohoo","m":"to cry","o":"From the sound that one makes while crying. Not exclusively Nadsat."},{"w":"boorjoyce","m":"bourgeois","o":"Burgess' pronunciation of \"bourgeois\"."},{"w":"bootick","m":"boutique","o":"бутик (butik) from boutique, and a phonetic spelling of the English"},{"w":"brat, bratty","m":"brother","o":"брат (brat), and a pun on English brat"},{"w":"bratchny","m":"bastard","o":"брачный (bračnyj, “ matrimonial ”), — likely a shortened внебрачный (vnebračnyj, “ out-of-wedlock ”), even though stripping it of the prefix inverts the meaning"},{"w":"britva","m":"razor","o":"бритва (britva)"},{"w":"brooko","m":"belly","o":"брюхо (brjuxo)"},{"w":"brosay, brosat","m":"to throw","o":"бросай (brosaj, “ throw! ”, imperative), бросать (brosatʹ, “ to throw ”)"},{"w":"bruiseboys","m":"police officers, security guards","o":"cf bruiser"},{"w":"bugatties","m":"riches","o":"богатый (bogatyj)."},{"w":"bugatty","m":"rich","o":"богатый (bogatyj); cf Bugatti, a type of luxury car."},{"w":"cables","m":"blood vessels, tendons?, veins","o":"from their appearance"},{"w":"caff","m":"café","o":"café, caffè, кафе (kafe), not exclusively Nadsat."},{"w":"cal","m":"crap","o":"кал (kal, “ faeces ”), sometimes used as an invective as well"},{"w":"cancer","m":"cigarette","o":"Short for English slang cancer stick from the disease with which heavy smoking is most commonly associated"},{"w":"cantora","m":"office","o":"контора (kontora)"},{"w":"carman","m":"pocket","o":"карман (karman)"},{"w":"chai","m":"tea","o":"чай (čaj), not exclusively Nadsat."},{"w":"charles, charlie","m":"chaplain","o":"A play on Charlie Chaplin. Not exclusively Nadsat."},{"w":"chasha","m":"cup","o":"чашка (čaška); чаша (čaša, “ large bowl ”)"},{"w":"chasso","m":"guard","o":"часовой (časovoj)"},{"w":"cheena","m":"woman","o":"женщина (ženščina)"},{"w":"cheest","m":"to wash","o":"чистить (čistitʹ, “ to clean ”)"},{"w":"chelloveck","m":"person, man, fellow","o":"человек (čelovek, “ human, man ”)"},{"w":"chepooka","m":"nonsense","o":"чепуха (čepuxa)"},{"w":"chinny","m":"whiny","o":"нытье (nytʹje)"},{"w":"choodessny","m":"wonderful","o":"чудесный (čudesnyj)"},{"w":"chumble","m":"to mumble","o":"Blend of chatter +‎ mumble"},{"w":"cine","m":"cinema, film","o":"French slang ciné; cf кино (kino)"},{"w":"clockwork","m":"mechanically responsive","o":"(See notes)"},{"w":"clop","m":"to knock","o":"хлопать (xlopatʹ, “ clap ”); German klopfen (“ to knock ”); onomatopoeia"},{"w":"cluve","m":"beak","o":"клюв (kljuv)"},{"w":"collocoll","m":"bell","o":"колокол (kolokol)"},{"w":"crack","m":"to break up, smash","o":""},{"w":"crark","m":"to howl","o":"Blend of crow +‎ bark"},{"w":"crast","m":"steal, rob, robbery","o":"красть (krastʹ, “ to steal ”)"},{"w":"creech","m":"to shout, scream","o":"кричать (kričatʹ)"},{"w":"cutter","m":"money","o":"From Cockney rhyming slang derived from bread-and-butter"},{"w":"dama","m":"lady","o":"дама (dama); cf Dame"},{"w":"decrep","m":"elder","o":"Short for \"decrepit\""},{"w":"ded, dedoochka","m":"old man","o":"дед (ded), дедушка (deduška, “ grandfather ”), coll. \"old man\""},{"w":"deng","m":"money","o":"деньги (denʹgi)"},{"w":"disc, disk","m":"music record","o":"disque, диск (disk)"},{"w":"disk-bootick","m":"record shop, literally disc-boutique","o":"диск (disk) + бутик (butik), cf discothèque"},{"w":"devotchka","m":"young woman","o":"девочка (devočka, “ girl ”)"},{"w":"dobby","m":"good","o":"добрый (dobryj, “ kind, good ”)"},{"w":"dook","m":"trace, ghost","o":"дух (dux, literally “ spirit ”); Romani dook (“ magic ”)"},{"w":"domy","m":"house","o":"дом (dom) or abbreviation of domicile"},{"w":"dorogoy","m":"dear, valuable, expensive","o":"дорогой (dorogoj)"},{"w":"dratsing","m":"fighting","o":"драться (dratʹsja, “ to fight ”)"},{"w":"drencrom","m":"drug","o":"Possibly adrenochrome"},{"w":"droog","m":"friend","o":"друг (drug, “ friend ”)"},{"w":"droogie","m":"friendly","o":"дружелюбно (druželjubno, “ friendly ”)"},{"w":"dung","m":"to defecate","o":""},{"w":"dva","m":"two","o":"два (dva)"},{"w":"eegra","m":"game","o":"игра (igra)"},{"w":"eemya","m":"name","o":"имя (imja)"},{"w":"eggiweg","m":"egg","o":"Reduplication of egg"},{"w":"em","m":"mother","o":"Derived from the first letter of \"mother\"."},{"w":"espresso rapido","m":"train","o":"\"fast express\" in Italian"},{"w":"eunuch jelly","m":"gutless coward","o":"Eunuchs were court advisers who had been castrated; jelly from the notion of someone quivering in fear."},{"w":"fag","m":"tire, exhaust","o":"English slang. Not exclusively Nadsat."},{"w":"faggy/fagged","m":"tired, exhausted","o":"English slang. Not exclusively Nadsat"},{"w":"fashed","m":"bothered, annoyed, tired","o":"Scots fash"},{"w":"filly","m":"to play or fool around with","o":"Dim. of \"fiddle\", cf filly (horse)"},{"w":"filmdrome","m":"cinema","o":"From δρόμος (drómos, “ course ”), meaning \"place for doing films\"."},{"w":"firegold","m":"strong drink","o":"? \" firewater \" + gold from its appearance"},{"w":"fist","m":"to punch","o":"From Engl. fist, cf удар кулаком, БИТЬ кулаком"},{"w":"flatblock","m":"block of flats, apartment block","o":"a more Soviet style word formation"},{"w":"flip","m":"wild or flipping","o":"truncation of flipping, a euphemism for \"fucking\", or Eng. slang to flip out (“ to go mad/crazy ”)"},{"w":"forella","m":"old trout, old lady","o":"форель (forelʹ), from German Forelle"},{"w":"fuzzy","m":"scratchy","o":"onomatopoiea"},{"w":"gazetta","m":"newspaper","o":"газета (gazeta), cf gazette"},{"w":"get","m":"git, unpleasant person","o":"variant of git, not exclusively Nadsat"},{"w":"glazz, glazzies, glazzballs","m":"Eye, eyes (also used to refer to nipples)","o":"глаз (glaz), also a pun on \"glass balls\""},{"w":"gloopy","m":"stupid","o":"глупый (glupyj)"},{"w":"glory","m":"hair","o":"Poss. a ref to 1 Corinthians 11:15: \"if a woman have long hair, it is a glory to her: for her hair is given her for a covering.\""},{"w":"godman","m":"priest, chaplain","o":""},{"w":"golly","m":"unit of money","o":"Rhyming slang, \"lolly,\" or \"pretty polly\", or alternatively \"golly gosh\" as a rhyme for dosh"},{"w":"goloss","m":"voice/tone","o":"голос (golos)"},{"w":"goober","m":"lip","o":"губа (guba), cf gob"},{"w":"gooly","m":"to walk","o":"гулять (guljatʹ)"},{"w":"gorlo","m":"throat","o":"горло (gorlo)"},{"w":"govoreet","m":"speak","o":"говорить (govoritʹ)"},{"w":"grahzny","m":"dirty","o":"грязный (grjaznyj)"},{"w":"grape","m":"uvula","o":"Poss. from its appearance."},{"w":"grazzy","m":"soiled","o":"грязь (grjazʹ, “ dirt ”), грязный (grjaznyj, “ dirty ”)"},{"w":"gromky","m":"loud","o":"громкий (gromkij)"},{"w":"groody","m":"breast","o":"грудь (grudʹ, “ breast ”), груди pl (grudi, “ breasts ”)"},{"w":"growling","m":"great","o":""},{"w":"gruppa","m":"group","o":"группа (gruppa)"},{"w":"guff, guffaw","m":"laugh","o":"guffaw, not exclusively Nadsat"},{"w":"gulliver","m":"head","o":"голова (golova); Nadsat form influenced by the titular character of Gulliver's Travels"},{"w":"guttiwuts","m":"guts","o":"Reduplication of guts"},{"w":"hen-korm","m":"small change, i.e. chickenfeed","o":"Engl. hen + корм (korm, noun, literally “ feed ”), but cf corn"},{"w":"hilly","m":"excellent","o":""},{"w":"horn","m":"to cry out","o":"onomatopoeia or metaphor"},{"w":"horrorshow","m":"good, well, wonderful, excellent","o":"хорошо (xorošo, “ well, good ”), a pun on \"horror show\""},{"w":"hound-and-horny","m":"corny","o":"Rhyming slang"},{"w":"in-out in-out, the old in and out","m":"sexual intercourse","o":""},{"w":"interessovat","m":"to interest","o":"интересовать (interesovatʹ)"},{"w":"itty","m":"to go","o":"идти (idti, “ to go ”)"},{"w":"jammiwam","m":"jam","o":"Reduplication of jam"},{"w":"jeezny","m":"life","o":"жизнь (žiznʹ)"},{"w":"juice","m":"tears, blood","o":"from their appearance"},{"w":"kartoffel","m":"potatoes","o":"картофель (kartofelʹ), which itself is derived from German Kartoffel (“ potato ”)"},{"w":"kashl","m":"cough","o":"кашель (kašelʹ)"},{"w":"keeshkas","m":"guts","o":"кишка (kiška, “ gut ”)"},{"w":"kisa","m":"girl","o":"киса (kisa, literally “ kitty ”)"},{"w":"kleb","m":"bread","o":"хлеб (xleb)"},{"w":"klootch","m":"key","o":"ключ (ključ)"},{"w":"knives","m":"drugs","o":"?knives and forks?"},{"w":"knopka","m":"button","o":"кнопка (knopka); cf knob"},{"w":"knopkavat","m":"buttoning","o":"кнопка (knopka) + -овать (-ovatʹ) (pronounced -avat) suffix used to form verb infinitive from the noun, cf. газ (gaz, “ gas ”) - colloquial газовать (gazovatʹ, “ to gas up ”)"},{"w":"k const $ = (id) => document.getElementById(id);
const q = $("q"), results = $("results"), statusEl = $("status"), countEl = $("count"),
      clearBtn = $("clear"), lettersEl = $("letters"), topEl = $("top");

ENTRIES.forEach((e, i) => {
  e.i = i;
  e.wl = e.w.toLowerCase();
  e.ml = e.m.toLowerCase();
  e.ol = e.o.toLowerCase();
  const c = e.w.replace(/[^a-z]/gi, "").charAt(0).toUpperCase();
  e.L = c || "#";
});
const LETTERS = [...new Set(ENTRIES.map(e => e.L))].sort();

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hl(text, term) {
  if (!term) return esc(text);
  const lower = text.toLowerCase();
  let out = "", pos = 0, idx;
  while ((idx = lower.indexOf(term, pos)) !== -1) {
    out += esc(text.slice(pos, idx)) + "<mark>" + esc(text.slice(idx, idx + term.length)) + "</mark>";
    pos = idx + term.length;
  }
  return out + esc(text.slice(pos));
}
function card(e, term) {
  return '<li><div class="w">' + hl(e.w, term) + '</div><div class="m">' + hl(e.m, term) + "</div>" +
    (e.o ? '<div class="o">' + hl(e.o, term) + "</div>" : "") + "</li>";
}

function score(e, t) {
  const forms = e.wl.split(/\s*,\s*|\s*\/\s*/);
  if (forms.includes(t)) return 0;
  if (forms.some(f => f.startsWith(t))) return 1;
  if (e.wl.includes(t)) return 2;
  const words = e.ml.split(/[^a-z']+/);
  if (words.includes(t)) return 3;
  if (e.ml.includes(t)) return 4;
  if (e.ol.includes(t)) return 5;
  return -1;
}

function stems(t) {
  const out = [];
  const add = (s) => { if (s.length >= 3 && s !== t && !out.includes(s)) out.push(s); };
  t = t.replace(/[’]/g, "'");
  add(t.replace(/'s$/, ""));
  for (const end of ["ies", "ied", "ing", "ed", "es", "ly", "s", "d"]) {
    if (t.endsWith(end)) {
      add(t.slice(0, -end.length));
      if (end === "ies" || end === "ied") add(t.slice(0, -3) + "y");
    }
  }
  if (t.length > 5) add(t.slice(0, -1));
  return out;
}

// Calibre (or any link) can pass the word as ?q=word, ?word=word or #word.
function wordFromUrl() {
  try {
    const p = new URLSearchParams(location.search);
    for (const k of ["q", "word", "w", "s", "query", "search"]) {
      const v = p.get(k);
      if (v && v.trim()) return v.trim();
    }
    const h = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
    if (h && !/^g-/.test(h)) return h;
  } catch (err) {}
  return "";
}

function render() {
  const term = q.value.trim().toLowerCase();
  clearBtn.hidden = !q.value;
  lettersEl.hidden = !!term;
  if (!term) {
    countEl.textContent = ENTRIES.length + " words";
    statusEl.textContent = "";
    let html = "", cur = "";
    for (const e of ENTRIES) {
      if (e.L !== cur) {
        if (cur) html += "</ul>";
        cur = e.L;
        html += '<div class="group-head" id="g-' + cur + '">' + cur + "</div><ul>";
      }
      html += card(e, "");
    }
    results.innerHTML = html + "</ul>";
  } else {
    const hits = [];
    for (const e of ENTRIES) {
      const s = score(e, term);
      if (s >= 0) hits.push([s, e]);
    }
    hits.sort((a, b) => a[0] - b[0] || a[1].i - b[1].i);
    let shownFor = "";
    if (!hits.length) {
      // Selected text in a book is often an inflected form (droogs, viddied), so retry with the ending trimmed.
      for (const stem of stems(term)) {
        for (const e of ENTRIES) {
          const s = score(e, stem);
          if (s >= 0 && s <= 2) hits.push([s, e]);
        }
        if (hits.length) { hits.sort((a, b) => a[0] - b[0] || a[1].i - b[1].i); shownFor = stem; break; }
      }
    }
    countEl.textContent = hits.length + (hits.length === 1 ? " match" : " matches");
    if (!hits.length) {
      statusEl.textContent = "";
      results.innerHTML = '<div class="empty">No match for <b>' + esc(q.value.trim()) +
        '</b>. Try the English meaning instead, for example "friend" finds droog.</div>';
    } else {
      statusEl.textContent = shownFor ? 'No exact match for "' + term + '". Showing "' + shownFor + '".' : "";
      results.innerHTML = "<ul>" + hits.map(h => card(h[1], shownFor || term)).join("") + "</ul>";
    }
  }
  sizeTop();
}

function sizeTop() {
  document.documentElement.style.setProperty("--top-h", topEl.offsetHeight + "px");
}

lettersEl.innerHTML = LETTERS.map(l => '<button type="button" data-l="' + l + '">' + l + "</button>").join("");
lettersEl.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const g = document.getElementById("g-" + b.dataset.l);
  if (g) g.scrollIntoView({ block: "start" });
});

q.addEventListener("input", render);
q.addEventListener("keydown", (ev) => { if (ev.key === "Enter") q.blur(); });
clearBtn.addEventListener("click", () => { q.value = ""; render(); q.focus(); });
window.addEventListener("resize", sizeTop);
